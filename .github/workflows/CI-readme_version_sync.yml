name: CI | Sync vLLM version in READMEs

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync_version:
    runs-on: ubuntu-latest
    name: Check README version matches Dockerfile and update if needed
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract vLLM version from Dockerfile and sync READMEs
        run: |
          echo "Extracting vLLM image tag from Dockerfile..."
          # VLLM_VERSION may be a release tag or a commit-addressed nightly tag.
          dockerfile_version=$(sed -n 's/^ARG VLLM_VERSION=//p' Dockerfile | head -1)

          if [ -z "$dockerfile_version" ]; then
            echo "ERROR: Could not extract vLLM version from Dockerfile."
            exit 1
          fi
          echo "Dockerfile vLLM version: $dockerfile_version"
          echo "VLLM_VERSION=$dockerfile_version" >> $GITHUB_ENV

          updated=0
          for readme in README.md .runpod/README.md; do
            if [ ! -f "$readme" ]; then
              echo "Skipping $readme (not found)"
              continue
            fi

            readme_version=$(sed -n 's/^Default vLLM image tag: `\([^`]*\)`.*/\1/p' "$readme" | head -1)
            echo "$readme current image tag: ${readme_version:-not found}"

            if [ "$readme_version" = "$dockerfile_version" ]; then
              echo "$readme is already up to date."
              continue
            fi

            if [ -z "$readme_version" ]; then
              echo "ERROR: Could not find the default vLLM image tag in $readme."
              exit 1
            fi

            echo "Updating $readme from $readme_version to $dockerfile_version..."
            sed -i "s|^Default vLLM image tag: .*|Default vLLM image tag: \`${dockerfile_version}\`|" "$readme"
            updated=1
          done

          echo "UPDATED=$updated" >> $GITHUB_ENV

      - name: Create Pull Request
        if: env.UPDATED == '1'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: sync vLLM image tag to ${{ env.VLLM_VERSION }} in READMEs"
          title: "docs: sync vLLM image tag to ${{ env.VLLM_VERSION }} in READMEs"
          body: |
            The vLLM image tag in the Dockerfile has been updated to `${{ env.VLLM_VERSION }}`.

            This PR syncs the version badge/link in:
            - `README.md`
            - `.runpod/README.md`
          branch: docs/sync-vllm-image-${{ env.VLLM_VERSION }}
          labels: documentation
